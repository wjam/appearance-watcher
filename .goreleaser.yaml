# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

project_name: appearance-watcher

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - main: .
    goarch:
      - amd64
      - arm64
    goos:
      - linux
      - darwin
    ignore:
      - goos: darwin
        goarch: amd64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath

gomod:
  proxy: true

checksum:
  name_template: sha256sums.txt
  algorithm: sha256
  split: false

archives:
  - name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    formats:
      - binary
